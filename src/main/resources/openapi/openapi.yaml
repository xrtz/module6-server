openapi: 3.0.3
info:
  title: Nobel Prize API
  description: |
    Серверное приложение на Ktor с хранением данных в PostgreSQL (neon.tech).
    Поддерживает авторизацию через JWT и избранные премии для пользователей.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Локальный сервер

tags:
  - name: Auth
    description: Авторизация
  - name: Prizes
    description: Нобелевские премии
  - name: User
    description: Профиль и избранное

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Авторизация пользователя
      description: Возвращает JWT-токен (срок 30 минут).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              admin:
                value:
                  username: admin
                  password: admin123
      responses:
        '200':
          description: Успешная авторизация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Неверный логин или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v2/prizes:
    get:
      tags: [Prizes]
      summary: Список всех премий
      description: Публичный эндпоинт. Возвращает все премии из БД с лауреатами.
      responses:
        '200':
          description: Список премий
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Prize'

  /users/me:
    get:
      tags: [User]
      summary: Профиль текущего пользователя
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Профиль пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Неавторизованный запрос
        '404':
          description: Пользователь не найден

  /users/me/prizes:
    get:
      tags: [User]
      summary: Избранные премии пользователя
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список избранных премий
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FavoritePrize'
        '401':
          description: Неавторизованный запрос

  /users/me/prizes/{prizeId}:
    post:
      tags: [User]
      summary: Добавить премию в избранное
      security:
        - bearerAuth: []
      parameters:
        - name: prizeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Премия добавлена
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Добавлено
        '400':
          description: Неверный ID
        '401':
          description: Неавторизованный запрос
    delete:
      tags: [User]
      summary: Удалить премию из избранного
      security:
        - bearerAuth: []
      parameters:
        - name: prizeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Премия удалена
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Удалено
        '400':
          description: Неверный ID
        '401':
          description: Неавторизованный запрос

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          example: admin123

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        username:
          type: string
          example: admin

    ErrorResponse:
      type: object
      properties:
        error:
          type: string

    Laureate:
      type: object
      properties:
        id:
          type: integer
        prizeId:
          type: integer
        fullName:
          type: string
        portion:
          type: string
        motivation:
          type: string
        portraitUrl:
          type: string

    Prize:
      type: object
      properties:
        id:
          type: integer
        awardYear:
          type: integer
          example: 2023
        category:
          type: string
          example: physics
        fullName:
          type: string
          example: Physics 2023
        motivation:
          type: string
        detailLink:
          type: string
        laureates:
          type: array
          items:
            $ref: '#/components/schemas/Laureate'

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          type: string

    FavoritePrize:
      type: object
      properties:
        prizeId:
          type: integer
        awardYear:
          type: integer
        category:
          type: string
        fullName:
          type: string
        motivation:
          type: string
